# The public demo on the OCI Ampere A1 VM: the agent API, Ollama on CPU, and Caddy for HTTPS.
#
#   docker compose --env-file deploy/.env -f deploy/compose.cloud.yml up -d --build
#
# deploy/.env lives on the VM only (git-ignored) and holds ORACLE_DSN, TDA_APP_PASSWORD,
# TDA_END_USER_PASSWORD, TDA_DEMO_TOKEN, PUBLIC_IP and ACME_CA. The admin password never comes
# here: dbinit and the DDS tests run from the laptop. Writes and memory stay off (see tda.config).
name: tda-cloud

services:
  app:
    build: ..
    image: tda-app:cloud
    environment:
      ORACLE_DSN: ${ORACLE_DSN:-oracle:1521/FREEPDB1}
      TDA_APP_PASSWORD: ${TDA_APP_PASSWORD:?set TDA_APP_PASSWORD in deploy/.env}
      TDA_END_USER_PASSWORD: ${TDA_END_USER_PASSWORD:?set TDA_END_USER_PASSWORD in deploy/.env}
      TDA_DEMO_TOKEN: ${TDA_DEMO_TOKEN:?set TDA_DEMO_TOKEN in deploy/.env}
      OLLAMA_BASE: http://ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:-nemotron-3.5-bolt:e4b}
      # A CPU model takes minutes per answer, not seconds.
      LLM_TIMEOUT_S: "900"
    depends_on: [ollama]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.11
    environment:
      OLLAMA_KEEP_ALIVE: 24h  # a reload from disk would land on the next visitor's answer
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "443:443"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in deploy/.env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]
    restart: unless-stopped

  # Fallback only, if the Always Free database fails the DDS probe: the 26ai Free container on the VM.
  oracle:
    profiles: [db]
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest}
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-}
    ports:
      - "127.0.0.1:1521:1521"  # loopback only: dbinit and the tests reach it through an SSH tunnel
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
    restart: unless-stopped

volumes:
  ollama:
  caddy:
  oradata:
