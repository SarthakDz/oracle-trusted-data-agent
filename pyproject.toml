[project]
name = "trusted-data-agent"
version = "0.1.0"
description = "A LangGraph SQL agent on Oracle AI Database 26ai with Deep Data Security, measured by a deterministic eval harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oracledb>=3.0",
    "pydantic-settings>=2.0",
    "litellm>=1.50",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "openinference-instrumentation-langchain>=0.1.80",
    "openinference-instrumentation-litellm>=0.1.51",
    "sqlglot>=30.25",
    "oracleagentmemory>=26.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The Laya decision model (tda.decisions): torch + an 808 MB checkpoint, so opt-in.
laya = ["laya>=0.4.17"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration'"
# LiteLLM's own TypedDicts trip a Pydantic notice on Python 3.10; harmless and not our code.
filterwarnings = ["ignore:.*`ReadOnly` qualifier:UserWarning"]
markers = [
    "integration: needs the Oracle container (make up && make db-init)",
    "llm: also needs Ollama with the agent and embedding models (make llm-up)",
]
